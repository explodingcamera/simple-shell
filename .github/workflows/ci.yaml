name: Run tests

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

jobs:
  test:
    name: Run tests (${{ matrix.toolchain }})
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - nightly
          - 1.98.0 # msrv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
          build-warnings: warn
      - name: Run tests
        run: |
          cargo test --all-features
          cargo test --no-default-features --features heapless
          cargo test --no-default-features
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -W warnings
      - name: Run fmt
        run: cargo fmt --all -- --check
        continue-on-error: true
