[package]
name = "simple-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A simple no_std shell for embedded systems"
repository = "https://github.com/explodingcamera/simple-shell"
license = "MIT OR Apache-2.0"
keywords = ["async", "embedded", "no-std", "repl", "shell"]
categories = ["command-line-interface", "embedded", "no-std", "no-std::no-alloc"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "blocking"
required-features = ["std"]

[[example]]
name = "async"
required-features = ["std"]

[dependencies]
embedded-io = { version = "0.7.1", default-features = false, optional = true }
embedded-io-async = { version = "0.7.0", default-features = false, optional = true }
heapless = { version = "0.9.3", default-features = false, optional = true }

[dev-dependencies]
smol = "2.0"

[features]
default = ["alloc"]
alloc = []
heapless = ["dep:heapless"]
std = ["alloc"]
embedded-io = ["dep:embedded-io", "dep:embedded-io-async"]
